[package]
name = "frogtend"
version = "0.144.0"
description = "Frogtend — la ludothèque de la maison, servie par Firehouse"
authors = ["Nimai"]
license = "Apache-2.0"
repository = "https://github.com/Nimai26/Frogtend"
edition = "2021"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la bibliothèque et l'exécutable sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "frogtend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
rand = "0.8"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "time"] }
fs2 = "0.4"
bytes = "1"
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
sha2 = "0.10"
sha1 = "0.10"
crc32fast = "1.5"
md-5 = "0.10"
chd = "0.3"
nod = "1.4"
flate2 = "1"
tauri-plugin-global-shortcut = "2"
yaml-rust2 = "0.13.0"

[target.'cfg(windows)'.dependencies]
# SDL3 compilé DANS le programme (décision de Seb, 30/09 : « SDL3 embarqué, aucune DLL ») : manettes PlayStation,
# Switch, et celles qui ont un pilote HIDAPI dans SDL (une partie des 8BitDo…), lues pendant la partie pour le menu en
# jeu (XInput lit déjà les manettes Xbox ; DirectInput coupé, voir manettes_sdl.rs).
sdl3-sys = { version = "0.7", features = ["build-from-source-static"] }
# Menu en jeu : fenêtres du jeu, touches envoyées (Win32).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_System_LibraryLoader", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_System_Diagnostics_Debug", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Data_Pdf", "Storage", "Storage_Streams", "Foundation"] }

# Constructions de développement et tests : informations de débogage réduites (le cache restait énorme : 61 Go le
# 02/10, disque plein). Sans effet sur l'exécutable livré.
[profile.dev]
debug = "line-tables-only"

# Taille et vitesse de l'exécutable livré : https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
# Relire en vrai TOML ce que Frogtend écrit pour xemu (déjà dans l'arbre des dépendances : rien de plus à télécharger).
toml = "0.8"
# Compresser en gzip une réponse simulée (contrat 1.30) : déjà dans l'arbre des dépendances (zip, reqwest).
flate2 = "1"
