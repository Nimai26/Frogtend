[package]
name = "frogtend"
version = "0.43.3"
description = "Frogtend — la ludothèque de la maison, servie par Firehouse"
authors = ["Nimai"]
license = "Apache-2.0"
repository = "https://github.com/Nimai26/Frogtend"
edition = "2021"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la bibliothèque et l'exécutable sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "frogtend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
rand = "0.8"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util"] }
fs2 = "0.4"
bytes = "1"
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
sha2 = "0.10"
md-5 = "0.10"
chd = "0.3"
nod = "1.4"
flate2 = "1"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
# Menu en jeu : fenêtres du jeu, touches envoyées (Win32).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# Constructions de développement et tests : informations de débogage réduites (le cache restait énorme : 61 Go le
# 02/10, disque plein). Sans effet sur l'exécutable livré.
[profile.dev]
debug = "line-tables-only"

# Taille et vitesse de l'exécutable livré : https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
